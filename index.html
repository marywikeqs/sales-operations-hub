<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>Sales Operations Support Center</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
  --ink:#101828; --ink-2:#344054; --muted:#667085;
  --line:#e5e7eb; --line-2:#f0f1f3;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-light:#dbeafe;
  --badge:#eef2ff; --badge-ink:#3730a3;
  --band:#1e3a8a; --band-ink:#ffffff; --band-sub:#bfdbfe;
  --foot:#111827; --foot-ink:#f3f4f6; --foot-muted:#9ca3af;
  --good:#059669; --good-wash:#ecfdf3;
  --shadow-card:0 1px 3px rgba(0,0,0,.1);
  --shadow-lift:0 4px 12px rgba(0,0,0,.15);
  --r-card:12px; --r-hero:16px;
}
html[data-theme="dark"]{
  --bg:#0f1419; --surface:#1a1f2e; --surface-2:#232a3b;
  --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9ca3af;
  --line:#374151; --line-2:#4b5563;
  --accent:#60a5fa; --accent-dark:#93c5fd; --accent-light:#1e40af;
  --badge:#312e81; --badge-ink:#a5b4fc;
  --band:#1e3a8a; --band-ink:#f0f9ff; --band-sub:#93c5fd;
  --foot:#030712; --foot-ink:#e5e7eb; --foot-muted:#6b7280;
  --good:#10b981; --good-wash:#051f1f;
  --shadow-card:0 1px 3px rgba(0,0,0,.3);
  --shadow-lift:0 4px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,
       "Inter",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 32px}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;letter-spacing:-.3px}
.brand .mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent);flex:0 0 auto}
.brand .mark svg{width:18px;height:18px;color:#fff}
.brand em{font-style:normal;color:var(--accent)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;
  font-weight:550;display:flex;gap:6px;align-items:center}
.theme:hover{background:var(--surface-2)}

/* hero */
.hero{background:var(--surface);border-radius:var(--r-hero);padding:48px 32px;text-align:center;margin:32px 0}
.hero h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-1px}
.hero p{margin:10px auto 0;max-width:560px;color:var(--muted);font-size:15px;line-height:1.7}
.searchrow{margin:24px auto 0;max-width:520px;position:relative}
.searchrow input{
  width:100%;padding:12px 48px 12px 40px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-card);transition:border-color .2s,box-shadow .2s
}
.searchrow input::placeholder{color:var(--muted)}
.searchrow input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.searchrow .mag{position:absolute;left:13px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none}

/* main layout */
main{display:grid;grid-template-columns:1fr 380px;gap:32px;padding:32px 0}
.content{min-width:0}

/* channels */
.channels{margin:0 0 40px}
.channels-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px}
.channel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:28px;box-shadow:var(--shadow-card);transition:transform .2s,box-shadow .2s,border-color .2s
}
a.channel:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--accent-light)}
.channel-icon{
  width:56px;height:56px;border-radius:var(--r-card);display:grid;place-items:center;
  background:var(--accent-light);color:var(--accent);font-size:28px;margin-bottom:14px
}
.channel-icon svg{width:28px;height:28px}
.channel h3{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
.channel p{margin:8px 0 0;font-size:13px;color:var(--muted);line-height:1.6}
.channel-actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.channel-actions a,.channel-actions button{
  font-size:13px;font-weight:600;padding:8px 16px;border-radius:6px;border:1px solid var(--line);
  background:var(--surface);color:var(--accent);cursor:pointer;transition:all .2s;
  display:inline-flex;align-items:center;gap:6px
}
.channel-actions a:hover,.channel-actions button:hover{
  background:var(--accent);color:#fff;border-color:var(--accent)
}

/* faq */
.faq-section h2{margin:0 0 20px;font-size:18px;font-weight:750;letter-spacing:-.4px}
.faq-search{margin:0 0 20px;position:relative}
.faq-search input{
  width:100%;padding:12px 40px 12px 16px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-card)
}
.faq-search input::placeholder{color:var(--muted)}
.faq-search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.faq-search .mag{position:absolute;right:13px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none}
.faq-items{display:flex;flex-direction:column;gap:0}
.faq-item{
  border:1px solid var(--line);border-bottom:none;background:var(--surface);
  padding:0
}
.faq-item:last-child{border-bottom:1px solid var(--line)}
.faq-trigger{
  width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;
  justify-content:space-between;gap:10px;transition:background .2s
}
.faq-trigger:hover{background:var(--surface-2)}
.faq-trigger.open{color:var(--accent)}
.faq-icon{width:5px;height:5px;border-top:2px solid currentColor;border-right:2px solid currentColor;
  transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.faq-trigger.open .faq-icon{transform:rotate(135deg) translateY(2px)}
.faq-answer{
  display:none;padding:0 16px 16px;font-size:13.5px;color:var(--muted);line-height:1.7
}
.faq-answer.open{display:block}

/* sidebar */
.sidebar{display:flex;flex-direction:column;gap:20px}
.ticket-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:24px;box-shadow:var(--shadow-card)}
.ticket-form h3{margin:0 0 16px;font-size:15px;font-weight:750;letter-spacing:-.2px}
.ticket-form p{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.form-group{margin:0 0 14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink-2)}
.form-group input,.form-group textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  font:inherit;font-size:13px;background:var(--surface);color:var(--ink);
  resize:vertical
}
.form-group input:focus,.form-group textarea:focus{
  outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)
}
.form-group textarea{min-height:100px;font-family:inherit}
.form-submit{
  width:100%;padding:11px 16px;border:0;border-radius:6px;background:var(--accent);
  color:#fff;font-size:13px;font-weight:650;cursor:pointer;transition:background .2s
}
.form-submit:hover{background:var(--accent-dark)}

/* footer */
.foot{background:var(--foot);color:var(--foot-ink);margin-top:64px;padding:44px 0 0}
.foot .wrap{padding-bottom:36px}
.foot .rule{border-top:1px solid rgba(255,255,255,.1);padding:16px 0 20px;
  font-size:12px;color:var(--foot-muted)}

@media (max-width:960px){
  main{grid-template-columns:1fr;gap:24px}
  .sidebar{flex-direction:row;flex-wrap:wrap}
  .ticket-form{flex:1;min-width:300px}
}
@media (max-width:768px){
  .wrap{padding:0 20px}
  .hero{padding:36px 20px}
  .hero h1{font-size:24px}
  .channels-grid{grid-template-columns:1fr}
  main{padding:24px 0}
  .sidebar{flex-direction:column}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <a class="brand" href="#top">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16M4 12h16M4 16h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/><circle cx="15" cy="16" r="1.7" fill="currentColor"/></svg></span>
      Sales<em>Ops</em> Hub
    </a>
    <button class="theme" id="themeBtn">🌙 Dark</button>
  </div>
</div>

<div class="wrap">
  <div class="hero">
    <h1>Sales Operations Support Center</h1>
    <p>Get help and find answers to your questions about pricing, processes, compensation, and more.</p>
    <div class="searchrow">
      <svg class="mag" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      <input type="text" id="search" placeholder="Search FAQ and channels..." autocomplete="off" aria-label="Search support center">
    </div>
  </div>
</div>

<main class="wrap">
  <div class="content">
    <section class="channels">
      <h2>How can we help?</h2>
      <div class="channels-grid" id="channelsGrid"></div>
    </section>

    <section class="faq-section">
      <h2>Frequently Asked Questions</h2>
      <div class="faq-search">
        <svg class="mag" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input type="text" id="faqSearch" placeholder="Search FAQs..." autocomplete="off" aria-label="Search FAQs">
      </div>
      <div class="faq-items" id="faqItems"></div>
    </section>
  </div>

  <aside class="sidebar">
    <form class="ticket-form" id="ticketForm">
      <h3>Submit a Ticket</h3>
      <p>We'll respond within 24 hours</p>
      <div class="form-group">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required aria-label="Your name">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required aria-label="Your email">
      </div>
      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required aria-label="Ticket subject">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required aria-label="Ticket message"></textarea>
      </div>
      <button type="submit" class="form-submit">Submit Ticket</button>
    </form>
  </aside>
</main>

<footer class="foot">
  <div class="wrap">
    <div class="rule">
      <span>© <span id="yr"></span> Quilt Software · internal use only</span>
    </div>
  </div>
</footer>

<script>
const CHANNELS = [
  { title:'Pricing & Discounting', desc:'Rate cards, discount bands & approval thresholds.', icon:'💰', actions:[{label:'Get Help',url:''}] },
  { title:'Sales Process & Deal Stages', desc:'Stage definitions, exit criteria & handoffs.', icon:'📊', actions:[{label:'Get Help',url:''}] },
  { title:'Compensation & Commission', desc:'Commission plans, comp tracking & payouts.', icon:'💵', actions:[{label:'Get Help',url:''}] },
  { title:'Reporting & Analytics', desc:'Dashboards, reports & data access.', icon:'📈', actions:[{label:'View Dashboards',url:'https://cx.quiltteam.com/sfdc-shortcut'}] },
  { title:'Systems & Access', desc:'Salesforce access, tool onboarding & permissions.', icon:'🔐', actions:[{label:'Get Help',url:''}] },
  { title:'Ask Sales Ops', desc:'General questions or special requests.', icon:'💬', actions:[{label:'Get Help',url:''}] },
];

const FAQ = [
  { q:'How do I request a discount on a deal?', a:'Discounts up to 10% can be approved by your manager. Beyond that, submit a request through Sales Ops and we\'ll review within 24 hours.' },
  { q:'What are the current rate cards?', a:'Rate cards are maintained in the Pricing Guidelines resource. Contact Sales Ops for the latest version specific to your territory.' },
  { q:'How do I track my commission?', a:'Commission information is available in Salesforce under Reports. If you need help accessing reports, submit a ticket.' },
  { q:'How do I get Salesforce access?', a:'Request access through Systems & Access channel above. Provisioning typically takes 1-2 business days.' },
  { q:'What data can I access?', a:'Standard sales team members have access to their own pipeline and account data. Custom dashboards or cross-team data requires manager approval.' },
  { q:'Where are playbooks and processes documented?', a:'All sales processes and playbooks will be linked in the Resources section as they\'re finalized. Contact Sales Ops if you need something specific.' },
];

let query = '';
let faqQuery = '';

function renderChannels(){
  const filtered = query.toLowerCase() === '' ? CHANNELS :
    CHANNELS.filter(c => (c.title + ' ' + c.desc).toLowerCase().includes(query.toLowerCase()));

  document.getElementById('channelsGrid').innerHTML = filtered.map(c => `
    <a class="channel" href="javascript:void(0)">
      <div class="channel-icon">${c.icon}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
      <div class="channel-actions">
        ${c.actions.map(a => a.url
          ? `<a href="${a.url}" target="_blank" rel="noopener">${a.label}</a>`
          : `<button disabled style="opacity:0.5">${a.label}</button>`
        ).join('')}
      </div>
    </a>
  `).join('');
}

function renderFAQ(){
  const filtered = faqQuery.toLowerCase() === '' ? FAQ :
    FAQ.filter(f => (f.q + ' ' + f.a).toLowerCase().includes(faqQuery.toLowerCase()));

  document.getElementById('faqItems').innerHTML = filtered.map((f, i) => `
    <div class="faq-item">
      <button class="faq-trigger" data-index="${i}">
        ${f.q}
        <span class="faq-icon"></span>
      </button>
      <div class="faq-answer" data-index="${i}">${f.a}</div>
    </div>
  `).join('');

  document.querySelectorAll('.faq-trigger').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = e.currentTarget.dataset.index;
      const answer = document.querySelector(`.faq-answer[data-index="${idx}"]`);
      const isOpen = answer.classList.contains('open');
      document.querySelectorAll('.faq-answer').forEach(a => a.classList.remove('open'));
      document.querySelectorAll('.faq-trigger').forEach(t => t.classList.remove('open'));
      if(!isOpen){
        answer.classList.add('open');
        e.currentTarget.classList.add('open');
      }
    });
  });
}

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  renderChannels();
});

document.getElementById('faqSearch').addEventListener('input', e => {
  faqQuery = e.target.value;
  renderFAQ();
});

document.getElementById('ticketForm').addEventListener('submit', e => {
  e.preventDefault();
  alert('Ticket submission form is not yet configured. Please contact Sales Ops directly.');
  e.target.reset();
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = dark ? '🌙 Dark' : '☀️ Light';
});

document.getElementById('yr').textContent = new Date().getFullYear();

renderChannels();
renderFAQ();
</script>
</body>
</html>
