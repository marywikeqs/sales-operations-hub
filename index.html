<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quilt Sales Ops Hub</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='4 0 32 48'%3E%3Cpath d='M20 2 34 16 20 30 6 16z' fill='%2384B0D5'/%3E%3Cpath d='M20 18 34 32 20 46 6 32z' fill='%238F568F'/%3E%3Cpath d='M20 18 26 24 20 30 14 24z' fill='%2318214E'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Geist+Mono:wght@500;600&display=swap">
<style>
/* Same system as the BRD Hub: Quilt navy / plum / sky, navy sidebar, white cards on a cool ground. Light only. */
:root {
  --q-navy: #18214E; --q-navy-2: #232D63; --q-plum: #8F568F; --q-sky: #84B0D5;
  --bg: #F4F6FA; --surface: #FFFFFF; --surface-2: #F9FAFB;
  --ink: #141A38; --ink-2: #364152; --muted: #6A7385; --faint: #98A0AE;
  --line: #E7EAF0; --line-strong: #D6DBE4;
  --plum-soft: #F4ECF4; --sky-soft: #EAF2FA; --navy-soft: #EEF2F9;
  --ok: #1D7A4C;
  --r: 12px;
  --font: "Geist", "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Mono", monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.55 var(--font); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--q-sky); outline-offset: 2px; border-radius: 6px; }
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.015em; }
p { margin: 0; }

/* ---- sidebar (top bar on small screens) ---- */
.bar { background: var(--q-navy); color: #fff; position: sticky; top: 0; z-index: 10; box-shadow: inset 0 -3px 0 0 var(--q-plum); }
.bar-in { display: flex; align-items: center; gap: 14px 20px; flex-wrap: wrap; padding: 10px 16px; }
.brand { display: flex; align-items: center; gap: 10px; color: #fff; }
.qmark { display: inline-grid; place-items: center; width: 26px; height: 38px; flex: none; }
.qmark svg { width: 100%; height: 100%; display: block; }
.brand b { font-weight: 650; font-size: 15px; letter-spacing: -.01em; display: block; }
.brand small { display: block; font-size: 12px; color: #AFC6E3; line-height: 1.15; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; width: 100%; }
.nav::-webkit-scrollbar { display: none; }
.nav a { display: inline-flex; align-items: center; gap: 9px; padding: 7px 11px; border-radius: 7px; color: #C2CCE3; font-weight: 500; white-space: nowrap; }
.nav a:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav a.on { background: rgba(255, 255, 255, .12); color: #fff; box-shadow: inset 3px 0 0 var(--q-sky); }
.nav .ti { width: 17px; height: 17px; flex: none; }
.nav .n { margin-left: auto; font: 600 11px var(--mono); color: #AFC6E3; background: rgba(255, 255, 255, .08); border-radius: 9px; padding: 1px 7px; }
.bar-foot { display: none; }
.portal-link { display: inline-flex; align-items: center; gap: 9px; padding: 7px 11px; border-radius: 7px; color: #fff; font-weight: 500; border: 1px solid rgba(255, 255, 255, .22); white-space: nowrap; }
.portal-link:hover { background: rgba(255, 255, 255, .08); }
.portal-link .ti { width: 16px; height: 16px; }

@media (min-width: 1000px) {
  body { display: grid; grid-template-columns: 236px minmax(0, 1fr); align-items: start; }
  .bar { height: 100vh; box-shadow: none; }
  .bar-in { flex-direction: column; align-items: stretch; flex-wrap: nowrap; height: 100%; padding: 20px 12px; gap: 26px; }
  .brand { padding: 0 6px; }
  .nav { flex-direction: column; overflow: visible; }
  .nav a { width: 100%; padding: 8px 10px; }
  .portal-link { justify-content: flex-start; }
  .portal-link.first { margin-top: auto; }
  .portal-link + .portal-link { margin-top: -18px; }
  .bar-foot { display: block; padding: 0 8px; font-size: 12px; color: #8F9CC0; line-height: 1.5; }
  .bar-foot b { color: #C2CCE3; font-weight: 600; }
}

/* ---- page ---- */
main { max-width: 1160px; width: 100%; margin: 0 auto; padding: 34px 16px 64px; display: grid; gap: 38px; }
@media (min-width: 700px) { main { padding: 40px 36px 72px; } }
.hero { display: grid; gap: 18px; }
.hero h1 { font-size: 30px; font-weight: 650; letter-spacing: -.025em; color: var(--q-navy); }
.hero h1::after { content: ""; display: block; width: 44px; height: 4px; border-radius: 2px; margin-top: 12px;
  background: linear-gradient(90deg, var(--q-sky) 0 50%, var(--q-plum) 50% 100%); }
.hero .lede { color: var(--muted); font-size: 15px; max-width: 60ch; }
.search { position: relative; max-width: 520px; }
.search input { width: 100%; font: 15px var(--font); color: var(--ink); padding: 12px 40px 12px 40px; border: 1px solid var(--line-strong);
  border-radius: 10px; background: var(--surface); box-shadow: 0 1px 2px rgba(20, 26, 56, .05); }
.search input::placeholder { color: var(--faint); }
.search input:focus { outline: 0; border-color: var(--q-sky); box-shadow: 0 0 0 3px rgba(132, 176, 213, .32); }
.search .mag { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
.search kbd { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font: 500 11px var(--mono); color: var(--faint);
  border: 1px solid var(--line-strong); border-radius: 5px; padding: 1px 6px; background: var(--surface-2); }

#sections { display: grid; gap: 38px; }
section { scroll-margin-top: 90px; }
.sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.sec-h h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.sec-h p { font-size: 13px; color: var(--faint); }

/* apps: the four team tools */
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.app { position: relative; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto 1fr auto; gap: 10px; min-width: 0; padding: 20px; background: var(--surface);
  border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 1px 2px rgba(20, 26, 56, .05); overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease; }
.app::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: linear-gradient(90deg, var(--q-sky) 0 50%, var(--q-plum) 50% 100%); opacity: 0; transition: opacity .18s; }
.app:hover { transform: translateY(-2px); border-color: #C9CFDB; box-shadow: 0 2px 4px rgba(20, 26, 56, .05), 0 12px 28px -12px rgba(24, 33, 78, .28); }
.app:hover::before { opacity: 1; }
.app .icon { width: 42px; height: 42px; border-radius: 10px; background: var(--q-navy); color: #fff; display: grid; place-items: center; }
.app .icon svg { width: 21px; height: 21px; }
.app h3 { font-size: 16.5px; font-weight: 650; color: var(--ink); }
.app p { color: var(--muted); font-size: 13.5px; }
.app .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.app .foot { min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 12px; border-top: 1px solid var(--line); }
.host { flex: 1; min-width: 0; font: 500 11.5px var(--mono); color: var(--faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.open { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--q-navy); white-space: nowrap; }
.open svg { width: 14px; height: 14px; transition: transform .18s; }
.app:hover .open svg, .chan:hover .go { transform: translateX(3px); }
.app.locked { background: linear-gradient(180deg, #FBFAFD, #fff); border-style: dashed; border-color: var(--line-strong); }
.app.locked .icon { background: var(--q-plum); }
.tag { white-space: nowrap; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 4px; background: var(--plum-soft); color: var(--q-plum); }

/* help channels and dashboards: compact rows of cards */
.chans { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
.chan { display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: 0 1px 1px rgba(20, 26, 56, .04); transition: border-color .15s, box-shadow .15s; }
a.chan:hover { border-color: #C9CFDB; box-shadow: 0 2px 8px rgba(20, 26, 56, .08); }
.chan .ini { flex: none; width: 38px; height: 38px; border-radius: 9px; display: grid; place-items: center; font: 600 12px var(--mono);
  background: var(--sky-soft); color: var(--q-navy); }
.chan:nth-child(3n+2) .ini { background: var(--plum-soft); color: var(--q-plum); }
.chan:nth-child(3n) .ini { background: var(--navy-soft); color: var(--q-navy-2); }
.chan .txt { flex: 1; min-width: 0; }
.chan b { display: block; font-weight: 600; font-size: 14.5px; color: var(--ink); }
.chan span { display: block; font-size: 13px; color: var(--muted); }
.chan .go { flex: none; width: 16px; height: 16px; color: var(--faint); transition: transform .15s; }
.chan.pending { background: var(--surface-2); box-shadow: none; }
.chan.pending .go { display: none; }
.soon { flex: none; font-size: 11px; font-weight: 600; color: var(--faint); border: 1px dashed var(--line-strong); border-radius: 4px; padding: 1px 7px; }

.empty { color: var(--faint); font-size: 14px; padding: 18px; border: 1px dashed var(--line-strong); border-radius: 10px; text-align: center; }
mark { background: #F6E7B8; color: inherit; border-radius: 3px; padding: 0 1px; }
footer { color: var(--faint); font-size: 12px; display: flex; align-items: center; gap: 8px; padding-top: 8px; border-top: 1px solid var(--line); }
footer .qmark { width: 12px; height: 18px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto; } }

/* collapsible groups */
.grp { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); box-shadow: 0 1px 2px rgba(20, 26, 56, .04); }
.grp + .grp { margin-top: -26px; }   /* #sections' 38px gap, less: groups sit 12px apart */
.sec-toggle { all: unset; box-sizing: border-box; width: 100%; display: flex; align-items: center; gap: 14px; padding: 16px 20px; cursor: pointer; border-radius: 14px; }
.sec-toggle:hover { background: var(--surface-2, #F9FAFB); }
.sec-toggle:focus-visible { outline: 2px solid var(--q-sky); outline-offset: 2px; }
.sec-ic { width: 36px; height: 36px; border-radius: 9px; background: var(--navy-soft, #EEF2F9); color: var(--q-navy); display: grid; place-items: center; flex: none; }
.sec-t { flex: 1; min-width: 0; display: grid; gap: 2px; }
.sec-t h2 { margin: 0; font-size: 16px; font-weight: 650; color: var(--q-navy); text-transform: none; letter-spacing: -.01em; }
.sec-t p { margin: 0; font-size: 13px; color: var(--muted); }
.sec-n { font: 600 12px var(--mono, monospace); color: var(--muted); background: #EFF1F5; border-radius: 99px; padding: 2px 9px; }
.sec-toggle .caret { width: 18px; height: 18px; flex: none; color: var(--muted); transition: transform .15s; }
.sec-ic .ti { width: 19px; height: 19px; }
.grp.is-open .sec-toggle .caret { transform: rotate(90deg); }
.sec-b { padding: 0 20px 20px; display: grid; gap: 14px; }
@media (prefers-reduced-motion: reduce) { .sec-toggle .caret { transition: none; } }

/* pages: sidebar Apps -> topics; a page per topic */
.nav-apps { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 10px; border-radius: 7px; color: #C2CCE3; font-weight: 600; cursor: pointer; white-space: nowrap; }
.nav-apps:hover { background: rgba(255, 255, 255, .07); color: #fff; }
.nav-apps.on { background: rgba(255, 255, 255, .12); color: #fff; box-shadow: inset 3px 0 0 var(--q-sky); }
.nav-apps:focus-visible { outline: 2px solid var(--q-sky); outline-offset: 2px; }
.nav-apps .caret { margin-left: auto; width: 15px; height: 15px; transition: transform .15s; }
.nav-apps[aria-expanded="true"] .caret { transform: rotate(90deg); }
.nav-sub { display: grid; gap: 2px; }
.nav-sub a { padding-left: 22px !important; }
.crumbs { margin: 0; font-size: 13px; color: var(--muted); }
.crumbs a { color: var(--q-navy); font-weight: 600; }
.crumbs a:hover { text-decoration: underline; }
.topics { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
.topic { display: flex; align-items: flex-start; gap: 14px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(20, 26, 56, .05); transition: border-color .15s, box-shadow .15s, transform .15s; }
.topic:hover { border-color: #C9CFDB; transform: translateY(-1px); box-shadow: 0 2px 4px rgba(20, 26, 56, .05), 0 12px 28px -14px rgba(24, 33, 78, .28); }
.topic-t { flex: 1; min-width: 0; display: grid; gap: 4px; }
.topic-t b { font-size: 16px; color: var(--q-navy); }
.topic-t span { font-size: 13.5px; color: var(--muted); }
.topic-t small { font-size: 12px; color: var(--faint); }
.topic .go { flex: none; width: 16px; height: 16px; color: var(--faint); margin-top: 4px; transition: transform .15s; }
.topic:hover .go { transform: translateX(3px); }
.sec-h h2 a:hover { text-decoration: underline; }
.apps + .chans { margin-top: 14px; }
@media (max-width: 999px) { .nav-sub { display: flex; } .nav-sub[hidden] { display: none; } .nav-sub a { padding-left: 11px !important; } .nav-apps { width: auto; } }
</style>
</head>
<body>

<header class="bar">
  <div class="bar-in">
    <a class="brand" href="#/" aria-label="Quilt Sales Ops Hub, Apps">
      <span class="qmark" aria-hidden="true"><svg viewBox="4 0 32 48"><path d="M20 2 34 16 20 30 6 16z" fill="#84B0D5"/><path d="M20 18 34 32 20 46 6 32z" fill="#8F568F"/><path d="M20 18 26 24 20 30 14 24z" fill="#18214E"/></svg></span>
      <span><b>Quilt Software</b><small>Sales Ops Hub</small></span>
    </a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <a class="portal-link first" href="/portal"><svg class="ti" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/></svg>Team Portal</a>

<main id="top">
  <div class="hero">
    <p class="crumbs" id="crumbs" hidden></p>
    <h1 id="heroTitle">Sales Operations</h1>
    <p class="lede" id="heroLede">Everything you need from Sales Operations, in one place: Salesforce requests, pricing, sales documents, reporting and the forms to get things done.</p>
    <label class="search">
      <svg class="mag" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="q" placeholder="Search apps and help" autocomplete="off" aria-label="Search the hub">
      <kbd aria-hidden="true">/</kbd>
    </label>
  </div>
  <div id="sections"></div>
  <footer><span class="qmark" aria-hidden="true"><svg viewBox="4 0 32 48"><path d="M20 2 34 16 20 30 6 16z" fill="#84B0D5"/><path d="M20 18 34 32 20 46 6 32z" fill="#8F568F"/><path d="M20 18 26 24 20 30 14 24z" fill="#18214E"/></svg></span>
    © <span id="yr"></span> Quilt Software · Sales Operations · Internal use only</footer>
</main>

<script>
// ---- the content: edit these lists to add or change links ----
// Apps open in a new tab. Each one has its own sign-in.
const ICONS = {
  progress: '<path d="M4 19V5M4 19h16"/><path d="M8 15l3.5-4 3 2.5L20 7"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h3"/>',
  board: '<rect x="3.5" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="16.5" y="4" width="4" height="13" rx="1.5"/>',
  plan: '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4"/><path d="M12 11v6M10.2 12.6c0-.7.8-1.2 1.8-1.2s1.8.5 1.8 1.2-.8 1-1.8 1.2-1.8.5-1.8 1.2.8 1.2 1.8 1.2 1.8-.5 1.8-1.2"/>',
  lock: '<rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
  apps: '<rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/>',
  help: '<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .8-1 1.5v.4"/><circle cx="12" cy="16.8" r=".6" fill="currentColor"/>',
  chart: '<path d="M4 20h16"/><rect x="5.5" y="11" width="3" height="6" rx="1"/><rect x="10.5" y="7" width="3" height="10" rx="1"/><rect x="15.5" y="13" width="3" height="4" rx="1"/>',
  cloud: '<path d="M7.5 18.5h9.5a3.5 3.5 0 0 0 .4-7 5 5 0 0 0-9.6-1.4A4 4 0 0 0 7.5 18.5z"/>',
  tag: '<path d="M3.5 12.5V5a1.5 1.5 0 0 1 1.5-1.5h7.5l8 8-9 9z"/><circle cx="8" cy="8" r="1.4"/>',
  doc: '<path d="M7 3.5h7l4 4V20a.5.5 0 0 1-.5.5h-11A.5.5 0 0 1 6 20V4a.5.5 0 0 1 .5-.5z"/><path d="M14 3.5V8h4M9 12h6M9 15.5h6"/>',
  caret: '<path d="M9 6l6 6-6 6"/>',
};
// Grouped by what people come looking for (Mary, 2026-10: "broken out by what
// people are looking for. for example BRD Hub is Salesforce related"). An item
// with an icon shows as an app card, one with initials as a row. Each group
// collapses; the choice is remembered on this browser.
const SECTIONS = [
  { id: 'salesforce', name: 'Salesforce', about: 'Everything to do with Salesforce. Submit a change request (BRD) and follow it from intake to Go Live: the board, sprint plans, requirement and UAT sign-offs, and status updates. Get set up in Salesforce and our other sales tools, or request access and user changes.',  icon: 'cloud', note: 'Requests, projects and access for Salesforce.', items: [
    { title: 'BRD Hub', desc: 'Submit a Salesforce BRD and follow it from intake to Go Live: board, sprints, sign-offs and UAT.', icon: 'board', url: 'https://brd-hub.vercel.app/', tag: 'Salesforce' },
    { title: 'Systems & Access', desc: 'Salesforce, tool onboarding and user management.', ini: 'SA', url: 'https://systems-access-hub-production.up.railway.app/' },
  ]},
  { id: 'pricing', name: 'Pricing & Deals', about: 'How we price and discount. Current rate cards, discount structures and the guidance for quoting a deal.',  icon: 'tag', note: 'What to charge and how to discount.', items: [
    { title: 'Pricing & Discounting', desc: 'Rate cards, discount structures and pricing strategies.', ini: 'PD', url: 'https://pricing-hub-production-2481.up.railway.app/' },
  ]},
  { id: 'docs', name: 'Sales Documents & Enablement', about: 'The rules and guides for selling at Quilt: bookings rules, playbooks, process guides and enablement materials.',  short: 'Sales Documents', icon: 'doc', note: 'Rules, playbooks and guides.', items: [
    { title: 'Sales Documents', desc: 'Bookings rules, playbooks, guides and enablement materials.', ini: 'SD', url: 'https://sales-documents-hub-production.up.railway.app/' },
  ]},
  { id: 'reporting', name: 'Reporting', about: 'Dashboards and reports on sales performance, and how to get data or access to a report.',  icon: 'chart', note: 'Dashboards, reports and data.', items: [
    { title: 'Reporting & Analytics', desc: 'Dashboards, reports and data access.', ini: 'RA', url: 'https://sales-reporting-hub.up.railway.app/' },
  ]},
  { id: 'requests', name: 'Requests & Team', about: 'Forms and requests for Sales Operations: personnel changes for sales team members, general questions or special requests, and internal team tools.',  icon: 'help', note: 'Forms, questions and team tools.', items: [
    { title: 'Personnel Change Form', desc: 'Submit a personnel change notice for sales team members.', ini: 'PC', url: 'https://personnel-notice-form-production-b723.up.railway.app/' },
    { title: 'Ask Sales Ops', desc: 'General questions or special requests.', ini: 'ASO', url: '' },
    { title: 'Internal Team Tools', desc: 'Internal tools and resources.', ini: 'IT', url: 'https://internal-team-tools-production.up.railway.app/' },
  ]},
  // The Team Portal is linked from the sidebar only; the Commission Portal only from inside the Team Portal.
  // Salesforce Projects (the old Shortcut dashboard) now lives in the BRD Hub's Dashboard tab.
];

// ---- rendering ----
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const svg = (name, cls = 'ti') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
const arrow = cls => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>`;
const host = u => { try { return new URL(u).host; } catch (e) { return ''; } };
let query = '';
function hl(text) {
  const t = esc(text);
  if (!query) return t;
  const q = esc(query).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return t.replace(new RegExp(q, 'gi'), m => `<mark>${m}</mark>`);
}
const matches = it => !query || `${it.title} ${it.desc} ${it.tag || ''}`.toLowerCase().includes(query.toLowerCase());

function appCard(it) {
  return `<a class="app${it.same ? ' locked' : ''}" href="${esc(it.url)}"${it.same ? '' : ' target="_blank" rel="noopener"'}>
    <div class="top"><span class="icon">${svg(it.icon)}</span>${it.tag ? `<span class="tag">${hl(it.tag)}</span>` : ''}</div>
    <h3>${hl(it.title)}</h3>
    <p>${hl(it.desc)}</p>
    <div class="foot"><span class="host">${esc(it.same ? 'Sign-in required' : host(it.url))}</span><span class="open">Open ${arrow('')}</span></div>
  </a>`;
}
function rowCard(it) {
  const inner = `<span class="ini">${esc(it.ini)}</span><span class="txt"><b>${hl(it.title)}</b><span>${hl(it.desc)}</span></span>`;
  return it.url
    ? `<a class="chan" href="${esc(it.url)}" target="_blank" rel="noopener">${inner}${arrow('go')}</a>`
    : `<div class="chan pending">${inner}<span class="soon">Coming soon</span></div>`;
}
// ---- pages: #/ is Apps (every topic), #/<topic> is that topic's own page ----
const APPS = { id: 'apps', name: 'Apps', icon: 'apps' };
const HOME_LEDE = document.getElementById('heroLede').textContent;
const asRow = it => (it.icon ? { ...it, ini: it.title.split(/\s+/).map(w => w[0]).join('').slice(0, 3).toUpperCase() } : it);
const route = () => (location.hash.replace(/^#\/?/, '') || 'apps');
const topic = id => SECTIONS.find(s => s.id === id);

// the sidebar's Apps list opens and closes; remembered on this browser
let appsOpen = true;
try { appsOpen = localStorage.getItem('hub.appsOpen') !== '0'; } catch (e) { /* private mode */ }

function links(items) {
  const apps = items.filter(it => it.icon), rows = items.filter(it => !it.icon);
  return (apps.length ? `<div class="apps">${apps.map(appCard).join('')}</div>` : '')
    + (rows.length ? `<div class="chans">${rows.map(rowCard).join('')}</div>` : '');
}

function render() {
  const here = topic(route()) ? route() : 'apps';
  const t = topic(here);
  document.getElementById('crumbs').hidden = !t;
  document.getElementById('crumbs').innerHTML = t ? `<a href="#/">Apps</a> <span aria-hidden="true">›</span> ${esc(t.name)}` : '';
  document.getElementById('heroTitle').textContent = t ? t.name : 'Sales Operations';
  document.getElementById('heroLede').textContent = t ? t.about : HOME_LEDE;
  document.title = t ? `${t.name} · Quilt Sales Ops Hub` : 'Quilt Sales Ops Hub';
  let out;
  if (query) {                                    // search: every topic, matches only
    out = SECTIONS.map(s => {
      const items = s.items.filter(matches);
      return items.length ? `<section><div class="sec-h"><h2><a href="#/${s.id}">${esc(s.name)}</a></h2><p>${items.length} match${items.length === 1 ? '' : 'es'}</p></div>${links(items)}</section>` : '';
    }).join('') || `<div class="empty">Nothing matches “${esc(query)}”.</div>`;
  } else if (t) {                                 // a topic's own page
    out = `<section id="${t.id}">${t.items.length ? links(t.items) : `<div class="empty">Nothing in ${esc(t.name)} yet.</div>`}</section>`;
  } else {                                        // Apps: a tile per topic
    out = `<section id="apps"><div class="sec-h"><h2>Apps</h2><p>Pick a topic</p></div><div class="topics">${SECTIONS.map(s => `
      <a class="topic" href="#/${s.id}"><span class="sec-ic">${svg(s.icon)}</span>
        <span class="topic-t"><b>${esc(s.name)}</b><span>${esc(s.about)}</span>
        <small>${s.items.map(it => esc(it.title)).join(' · ')}</small></span>${arrow('go')}</a>`).join('')}</div></section>`;
  }
  document.getElementById('sections').innerHTML = out;
  document.getElementById('nav').innerHTML = `
    <button type="button" class="nav-apps${here === 'apps' && !query ? ' on' : ''}" id="navApps" aria-expanded="${appsOpen}">${svg('apps')}Apps${svg('caret', 'ti caret')}</button>
    <div class="nav-sub" id="navSub"${appsOpen ? '' : ' hidden'}>${SECTIONS.map(s =>
      `<a href="#/${s.id}" class="${here === s.id && !query ? 'on' : ''}"${here === s.id ? ' aria-current="page"' : ''}>${svg(s.icon)}${esc(s.short || s.name)}<span class="n">${s.items.filter(matches).length}</span></a>`).join('')}</div>`;
}

addEventListener('hashchange', () => { if (query) { q.value = ''; query = ''; } render(); scrollTo(0, 0); });
document.getElementById('nav').addEventListener('click', e => {
  if (!e.target.closest('#navApps')) return;
  appsOpen = !appsOpen;
  try { localStorage.setItem('hub.appsOpen', appsOpen ? '1' : '0'); } catch (err) { /* private mode */ }
  if (route() !== 'apps') location.hash = '#/';
  render();
});

const q = document.getElementById('q');
q.addEventListener('input', () => { query = q.value.trim(); render(); });
addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === 'Escape' && document.activeElement === q) { q.value = ''; query = ''; render(); }
});
document.getElementById('yr').textContent = new Date().getFullYear();
render();
</script>
</body>
</html>
