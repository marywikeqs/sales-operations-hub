<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>Sales Operations Support Center</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
  --ink:#101828; --ink-2:#344054; --muted:#667085;
  --line:#e5e7eb; --line-2:#f0f1f3;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-light:#dbeafe;
  --badge:#eef2ff; --badge-ink:#3730a3;
  --band:#1e3a8a; --band-ink:#ffffff; --band-sub:#bfdbfe;
  --foot:#111827; --foot-ink:#f3f4f6; --foot-muted:#9ca3af;
  --good:#059669; --good-wash:#ecfdf3;
  --shadow-card:0 1px 3px rgba(0,0,0,.1);
  --shadow-lift:0 4px 12px rgba(0,0,0,.15);
  --r-card:12px;
}
html[data-theme="dark"]{
  --bg:#0f1419; --surface:#1a1f2e; --surface-2:#232a3b;
  --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9ca3af;
  --line:#374151; --line-2:#4b5563;
  --accent:#60a5fa; --accent-dark:#93c5fd; --accent-light:#1e40af;
  --badge:#312e81; --badge-ink:#a5b4fc;
  --band:#1e3a8a; --band-ink:#f0f9ff; --band-sub:#93c5fd;
  --foot:#030712; --foot-ink:#e5e7eb; --foot-muted:#6b7280;
  --good:#10b981; --good-wash:#051f1f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,
       "Inter",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header */
.header{
  background:var(--surface);border-bottom:1px solid var(--line);
  height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;
}
.toggle-sidebar{
  border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;
  width:40px;height:40px;display:grid;place-items:center;border-radius:8px;
  transition:background .2s
}
.toggle-sidebar:hover{background:var(--surface-2)}
.header-spacer{flex:1}
.theme-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;
  font-weight:550;display:flex;gap:6px;align-items:center;transition:all .2s
}
.theme-btn:hover{background:var(--surface-2)}

/* sidebar */
.sidebar{
  width:240px;background:var(--surface);border-right:1px solid var(--line);
  padding:24px 0;overflow-y:auto;flex-shrink:0;
  transition:transform .3s ease,width .3s ease
}
.sidebar.collapsed{transform:translateX(-100%);width:0}
.sidebar-section{padding:0 16px;margin-bottom:24px}
.sidebar-title{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;padding:0
}
.sidebar-items{
  list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px
}
.sidebar-items a{
  display:block;padding:8px 12px;border-radius:6px;font-size:14px;
  color:var(--ink-2);transition:all .2s
}
.sidebar-items a:hover{background:var(--surface-2);color:var(--accent)}

/* main layout */
.container{display:flex;flex:1;min-height:0}
.main-content{flex:1;overflow-y:auto;padding:0}

/* hero */
.hero{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:32px 40px;
}
.hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.6px}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}
.hero-search{margin:18px 0 0;position:relative;max-width:500px}
.hero-search input{
  width:100%;padding:11px 38px 11px 36px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-card);transition:border-color .2s,box-shadow .2s
}
.hero-search input::placeholder{color:var(--muted)}
.hero-search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.hero-search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none}

/* content wrapper */
.content-wrapper{padding:32px 40px;display:grid;grid-template-columns:1fr 360px;gap:32px}

/* channels */
.channels h2{margin:0 0 20px;font-size:18px;font-weight:750;letter-spacing:-.4px}
.channels-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px
}
.channel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:24px;box-shadow:var(--shadow-card);cursor:pointer;transition:all .2s;
  text-decoration:none;display:flex;flex-direction:column
}
.channel:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--accent-light)}
.channel-icon{
  font-size:11px;font-weight:700;margin-bottom:12px;width:48px;height:48px;display:grid;place-items:center;
  background:var(--accent-light);color:var(--accent);border-radius:8px;letter-spacing:0.5px;text-transform:uppercase
}
.channel h3{margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.channel p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.channel-action{
  margin-top:12px;font-size:13px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:6px
}
.channel-action::after{content:'→';font-weight:400}

/* faq */
.faq h2{margin:0 0 20px;font-size:18px;font-weight:750;letter-spacing:-.4px}
.faq-search{margin:0 0 20px;position:relative}
.faq-search input{
  width:100%;padding:11px 38px 11px 36px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-card);transition:border-color .2s
}
.faq-search input::placeholder{color:var(--muted)}
.faq-search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.faq-search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none}
.faq-items{display:flex;flex-direction:column;gap:0}
.faq-item{
  background:var(--surface);border:1px solid var(--line);border-bottom:0;
  padding:0
}
.faq-item:last-child{border-bottom:1px solid var(--line)}
.faq-trigger{
  width:100%;text-align:left;background:none;border:0;padding:14px 16px;cursor:pointer;
  font-size:14px;font-weight:600;color:var(--ink);display:flex;align-items:center;
  justify-content:space-between;gap:10px;transition:background .2s
}
.faq-trigger:hover{background:var(--surface-2)}
.faq-trigger.open{color:var(--accent)}
.faq-icon{width:5px;height:5px;border-top:2px solid currentColor;border-right:2px solid currentColor;
  transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.faq-trigger.open .faq-icon{transform:rotate(135deg) translateY(2px)}
.faq-answer{
  display:none;padding:0 16px 16px;font-size:13.5px;color:var(--muted);line-height:1.7;
  background:var(--surface-2)
}
.faq-answer.open{display:block}

/* sidebar form */
.sidebar-form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:24px;box-shadow:var(--shadow-card);position:sticky;top:32px
}
.sidebar-form h3{margin:0 0 8px;font-size:15px;font-weight:750;letter-spacing:-.2px}
.sidebar-form p{margin:0 0 16px;font-size:12.5px;color:var(--muted);line-height:1.6}
.form-group{margin:0 0 14px}
.form-group label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:var(--ink-2)}
.form-group input,.form-group textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:6px;
  font:inherit;font-size:13px;background:var(--surface);color:var(--ink);
  transition:border-color .2s
}
.form-group input:focus,.form-group textarea:focus{
  outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)
}
.form-group textarea{min-height:90px;font-family:inherit;resize:vertical}
.form-submit{
  width:100%;padding:11px 16px;border:0;border-radius:6px;background:var(--accent);
  color:#fff;font-size:13px;font-weight:650;cursor:pointer;transition:background .2s
}
.form-submit:hover{background:var(--accent-dark)}

/* footer */
.footer{
  background:var(--foot);color:var(--foot-ink);border-top:1px solid rgba(255,255,255,.1);
  padding:24px 40px;margin-top:auto;font-size:12px;color:var(--foot-muted)
}

@media (max-width:1024px){
  .sidebar{position:fixed;left:0;top:56px;height:calc(100vh - 56px);z-index:100;
    box-shadow:2px 0 8px rgba(0,0,0,.1)}
  .content-wrapper{grid-template-columns:1fr}
  .channels-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .header{padding:0 12px}
  .toggle-sidebar{width:36px;height:36px}
  .hero{padding:20px 16px}
  .hero h1{font-size:20px}
  .content-wrapper{padding:20px 16px;gap:20px}
  .channels-grid{grid-template-columns:1fr}
  .sidebar-form{position:static}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="header">
  <button class="toggle-sidebar" id="toggleSidebar" aria-label="Toggle sidebar">☰</button>
  <div class="header-spacer"></div>
  <button class="theme-btn" id="themeBtn">☀️ Light</button>
</div>

<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3 class="sidebar-title">Dashboards</h3>
      <ul class="sidebar-items">
        <li><a href="https://cx.quiltteam.com/sfdc-shortcut" target="_blank" rel="noopener">Salesforce Projects</a></li>
      </ul>
    </div>
    <div class="sidebar-section">
      <h3 class="sidebar-title">Support</h3>
      <ul class="sidebar-items">
        <li><a href="#faqItems">FAQs</a></li>
        <li><a href="#ticketForm">Submit Ticket</a></li>
      </ul>
    </div>
  </aside>

  <main class="main-content">
    <div class="hero">
      <h1>Support Center</h1>
      <p>Get help and find answers to your questions</p>
      <div class="hero-search">
        <svg class="mag" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input type="text" id="search" placeholder="Search channels and FAQs..." autocomplete="off" aria-label="Search support center">
      </div>
    </div>

    <div class="content-wrapper">
      <div>
        <section class="channels">
          <h2>How can we help?</h2>
          <div class="channels-grid" id="channelsGrid"></div>

          <section class="faq">
            <h2>Frequently Asked Questions</h2>
            <div class="faq-search">
              <svg class="mag" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
              <input type="text" id="faqSearch" placeholder="Search FAQs..." autocomplete="off" aria-label="Search FAQs">
            </div>
            <div class="faq-items" id="faqItems"></div>
          </section>
        </section>
      </div>

      <aside>
        <form class="sidebar-form" id="ticketForm">
          <h3>Submit a Ticket</h3>
          <p>We'll respond within 24 hours</p>
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required aria-label="Your name">
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required aria-label="Your email">
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" required aria-label="Ticket subject">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" required aria-label="Ticket message"></textarea>
          </div>
          <button type="submit" class="form-submit">Submit Ticket</button>
        </form>
      </aside>
    </div>
  </main>
</div>

<footer class="footer">
  <div>© <span id="yr"></span> Quilt Software · Internal use only</div>
</footer>

<script>
const CHANNELS = [
  { title:'Pricing & Discounting', desc:'Rate cards, discount structures, and pricing strategies.', icon:'PD', url:'https://pricing-hub-production-2481.up.railway.app/' },
  { title:'Sales Documents', desc:'Bookings rules, playbooks, guides, and sales enablement materials.', icon:'SD', url:'https://sales-documents-hub-production.up.railway.app/' },
  { title:'Internal Team Tools', desc:'Internal tools and resources.', icon:'IT', url:'https://internal-team-tools-production.up.railway.app/' },
  { title:'Reporting & Analytics', desc:'Dashboards, reports, and data access.', icon:'RA', url:'https://sales-reporting-hub.up.railway.app/' },
  { title:'Systems & Access', desc:'Salesforce, tool onboarding, and user management.', icon:'SA', url:'https://systems-access-hub-production.up.railway.app/' },
  { title:'Ask Sales Ops', desc:'General questions or special requests.', icon:'ASO' },
];

const FAQ = [
  { q:'How do I request a discount on a deal?', a:'Discounts up to 10% can be approved by your manager. Beyond that, submit a request through Sales Ops and we\'ll review within 24 hours.' },
  { q:'What are the current rate cards?', a:'Rate cards are maintained in the Pricing Guidelines resource. Contact Sales Ops for the latest version specific to your territory.' },
  { q:'How do I track my commission?', a:'Commission information is available in Salesforce under Reports. If you need help accessing reports, submit a ticket.' },
  { q:'How do I get Salesforce access?', a:'Request access through Systems & Access channel above. Provisioning typically takes 1-2 business days.' },
  { q:'What data can I access?', a:'Standard sales team members have access to their own pipeline and account data. Custom dashboards or cross-team data requires manager approval.' },
  { q:'Where are playbooks and processes documented?', a:'All sales processes and playbooks will be linked in the Resources section as they\'re finalized. Contact Sales Ops if you need something specific.' },
];

let query = '';
let faqQuery = '';

function renderChannels(){
  const filtered = query.toLowerCase() === '' ? CHANNELS :
    CHANNELS.filter(c => (c.title + ' ' + c.desc).toLowerCase().includes(query.toLowerCase()));

  document.getElementById('channelsGrid').innerHTML = filtered.map(c => `
    <${c.url ? 'a href="' + c.url + '" target="_blank" rel="noopener"' : 'div'} class="channel">
      <div class="channel-icon">${c.icon}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
      <div class="channel-action">Get help</div>
    </${c.url ? 'a' : 'div'}>
  `).join('');
}

function renderFAQ(){
  const filtered = faqQuery.toLowerCase() === '' ? FAQ :
    FAQ.filter(f => (f.q + ' ' + f.a).toLowerCase().includes(faqQuery.toLowerCase()));

  document.getElementById('faqItems').innerHTML = filtered.map((f, i) => `
    <div class="faq-item">
      <button class="faq-trigger" data-index="${i}">
        ${f.q}
        <span class="faq-icon"></span>
      </button>
      <div class="faq-answer" data-index="${i}">${f.a}</div>
    </div>
  `).join('');

  document.querySelectorAll('.faq-trigger').forEach(btn => {
    btn.addEventListener('click', e => {
      const idx = e.currentTarget.dataset.index;
      const answer = document.querySelector(`.faq-answer[data-index="${idx}"]`);
      const isOpen = answer.classList.contains('open');
      document.querySelectorAll('.faq-answer').forEach(a => a.classList.remove('open'));
      document.querySelectorAll('.faq-trigger').forEach(t => t.classList.remove('open'));
      if(!isOpen){
        answer.classList.add('open');
        e.currentTarget.classList.add('open');
      }
    });
  });
}

document.getElementById('toggleSidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  renderChannels();
});

document.getElementById('faqSearch').addEventListener('input', e => {
  faqQuery = e.target.value;
  renderFAQ();
});

document.getElementById('ticketForm').addEventListener('submit', e => {
  e.preventDefault();
  alert('Ticket submission form is not yet configured. Please contact Sales Ops directly.');
  e.target.reset();
});

document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = dark ? '🌙 Dark' : '☀️ Light';
});

document.getElementById('yr').textContent = new Date().getFullYear();

renderChannels();
renderFAQ();
</script>
</body>
</html>
