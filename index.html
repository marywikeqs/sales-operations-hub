<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>Sales Operations Hub</title>
<style>
/* ------------------------------------------------------------------ *
 * Sales Operations Hub
 *
 * Content lives in the SECTIONS array near the bottom — add or edit a
 * card there and nothing else needs touching. url:'' renders a muted
 * "Link pending" item that is not clickable.
 *
 * Look: depth and spacing rather than outlines. Earlier versions drew a
 * 1px border around every element on a flat grey field, which is why it
 * read as boxy; surfaces now separate by elevation and tint, corners are
 * softer, and the type scale carries the hierarchy instead of borders.
 * ------------------------------------------------------------------ */
:root{
  --bg:#f7f8fa; --surface:#ffffff; --surface-2:#fbfbfd;
  --ink:#12141a; --ink-soft:#3d4350; --muted:#6b7280;
  --line:rgba(18,20,26,.07); --line-strong:rgba(18,20,26,.12);
  --accent:#5b52e8; --accent-2:#9b5cf6; --accent-ink:#4a41d6;
  --accent-wash:rgba(91,82,232,.09);
  --hover:rgba(18,20,26,.035);
  --good:#0f7a4a; --good-wash:rgba(15,122,74,.10);
  --shadow-1:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.03);
  --shadow-2:0 2px 4px rgba(16,24,40,.04), 0 12px 28px -10px rgba(16,24,40,.16);
  --radius:16px; --radius-sm:12px;
}
html[data-theme="dark"]{
  --bg:#0a0c11; --surface:#14171f; --surface-2:#171b24;
  --ink:#e9ebf1; --ink-soft:#c2c7d2; --muted:#949bab;
  --line:rgba(255,255,255,.08); --line-strong:rgba(255,255,255,.14);
  --accent:#8b86ff; --accent-2:#b98cff; --accent-ink:#a49fff;
  --accent-wash:rgba(139,134,255,.14);
  --hover:rgba(255,255,255,.045);
  --good:#5fd39a; --good-wash:rgba(95,211,154,.14);
  --shadow-1:0 1px 2px rgba(0,0,0,.30);
  --shadow-2:0 2px 6px rgba(0,0,0,.30), 0 16px 34px -12px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.55 "Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,
       "Inter",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  min-height:100vh;
}
/* an ambient wash, so the page is not a flat grey field */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(70rem 40rem at 8% -12%, var(--accent-wash), transparent 60%),
    radial-gradient(60rem 34rem at 100% 0%, rgba(155,92,246,.07), transparent 62%);
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

/* ---------------- header ---------------- */
.site-header{padding:22px 28px 0}
.site-header .inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:18px}
.brandline{display:flex;align-items:center;gap:13px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;
  background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:0 4px 14px -4px rgba(91,82,232,.55)}
.logo svg{width:20px;height:20px}
.site-title{font-size:19px;font-weight:650;letter-spacing:-.3px;line-height:1.2}
.site-sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.theme{
  border:0;background:var(--surface);color:var(--ink-soft);border-radius:999px;
  padding:9px 15px;cursor:pointer;font:inherit;font-size:13px;font-weight:550;
  display:flex;gap:7px;align-items:center;box-shadow:var(--shadow-1);
  transition:transform .14s ease, box-shadow .14s ease, color .14s ease
}
.theme:hover{color:var(--ink);box-shadow:var(--shadow-2);transform:translateY(-1px)}

/* ---------------- nav + search ---------------- */
.bar{position:sticky;top:0;z-index:5;padding:18px 28px 14px;
  background:linear-gradient(var(--bg) 62%, transparent);
  backdrop-filter:saturate(140%) blur(6px)}
.bar .inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;
  justify-content:space-between;gap:16px;flex-wrap:wrap}
/* a segmented control, not underlined tabs */
.nav{display:flex;gap:3px;padding:4px;border-radius:999px;
  background:var(--surface);box-shadow:var(--shadow-1);flex-wrap:wrap}
.nav a{
  display:flex;align-items:center;padding:8px 16px;border-radius:999px;
  font-size:13.5px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;
  transition:color .14s ease, background .14s ease
}
.nav a:hover{color:var(--ink);background:var(--hover)}
.nav a.active{
  color:#fff;background:linear-gradient(140deg,var(--accent),var(--accent-2));
  box-shadow:0 3px 10px -3px rgba(91,82,232,.6)
}
.search{position:relative;flex:1 1 240px;max-width:340px}
.search input{
  width:100%;padding:11px 14px 11px 40px;border:0;border-radius:999px;
  font:inherit;font-size:13.5px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-1);transition:box-shadow .14s ease
}
.search input::placeholder{color:var(--muted)}
.search input:focus{outline:0;box-shadow:var(--shadow-2),0 0 0 2px var(--accent)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none}

/* ---------------- page ---------------- */
.page{max-width:1120px;margin:0 auto;padding:10px 28px 80px}
.webpart{margin-bottom:38px}
.wp-head{display:flex;align-items:baseline;gap:11px;margin:0 0 16px;padding-left:2px}
.wp-head h2{font-size:23px;font-weight:650;margin:0;letter-spacing:-.5px}
.wp-head .n{font-size:12.5px;color:var(--muted);font-weight:500}

/* ---------------- tiles ---------------- */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.tile{
  position:relative;display:flex;gap:15px;align-items:flex-start;
  background:var(--surface);border-radius:var(--radius);padding:18px 19px;
  box-shadow:var(--shadow-1);
  transition:transform .16s ease, box-shadow .16s ease
}
a.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
.tile .ic{
  flex:0 0 46px;width:46px;height:46px;border-radius:13px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent-wash),transparent 85%);
  color:var(--accent-ink);
  box-shadow:inset 0 0 0 1px var(--line)
}
a.tile:hover .ic{background:linear-gradient(140deg,var(--accent),var(--accent-2));color:#fff;
  box-shadow:0 4px 12px -4px rgba(91,82,232,.6)}
.tile .ic svg{width:23px;height:23px}
.tile .t{min-width:0;padding-top:1px}
.tile .t .name{font-size:15.5px;font-weight:620;letter-spacing:-.2px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.tile .t .desc{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.5}
.tile .tmeta{display:flex;align-items:center;gap:7px;margin-top:11px;
  font-size:11.5px;color:var(--muted);min-width:0}
.tile .tmeta .host{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:999px;background:var(--line-strong);flex:0 0 auto}
.dot.live{background:var(--good);box-shadow:0 0 0 3px var(--good-wash)}
.tile.pending{background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.tile.pending .ic{background:var(--hover);color:var(--muted);box-shadow:none}
a.tile .go{
  position:absolute;right:15px;top:15px;color:var(--accent-ink);font-size:14px;
  opacity:0;transform:translate(-3px,3px);transition:.16s ease
}
a.tile:hover .go{opacity:1;transform:none}

/* ---------------- document list ---------------- */
/* one soft surface with hairline dividers, rather than a bordered table */
.doclist{background:var(--surface);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow-1)}
.doclist .row{
  display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;
  padding:15px 19px;position:relative;transition:background .14s ease
}
.doclist .row + .row::before{
  content:'';position:absolute;left:19px;right:19px;top:0;height:1px;background:var(--line)
}
.doclist a.row:hover{background:var(--hover)}
.doclist .fi{
  width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,var(--accent-wash),transparent 85%);
  color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--line)
}
.doclist a.row:hover .fi{background:linear-gradient(140deg,var(--accent),var(--accent-2));
  color:#fff;box-shadow:none}
.doclist .fi svg{width:20px;height:20px}
.doclist .nm{min-width:0}
.doclist .nm .name{font-size:14.5px;font-weight:600;letter-spacing:-.15px}
.doclist .nm .desc{font-size:12.5px;color:var(--muted);margin-top:2px}
.doclist .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.doclist .row.pending .fi{background:var(--hover);color:var(--muted);box-shadow:none}

/* ---------------- bits ---------------- */
.chip{font-size:10.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;white-space:nowrap}
.chip.live{background:var(--good-wash);color:var(--good)}
.chip.soon{background:var(--hover);color:var(--muted)}
.empty{color:var(--muted);font-size:14px;padding:44px 24px;text-align:center;
  border-radius:var(--radius);background:var(--surface-2);
  box-shadow:inset 0 0 0 1px var(--line)}
.foot{max-width:1120px;margin:0 auto;padding:0 28px 48px;color:var(--muted);font-size:12.5px}

@media (max-width:640px){
  .site-header,.bar,.page,.foot{padding-left:18px;padding-right:18px}
  .wp-head h2{font-size:20px}
  .tiles{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none !important}
  a.tile:hover{transform:none}
}
</style>
</head>
<body>
<header class="site-header">
  <div class="inner">
    <div class="brandline">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16M4 12h16M4 16h16" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="8" r="1.6" fill="#fff"/><circle cx="15" cy="16" r="1.6" fill="#fff"/></svg></div>
      <div>
        <div class="site-title">Sales Operations Hub</div>
        <div class="site-sub">Tools, dashboards and playbooks in one place</div>
      </div>
    </div>
    <button class="theme" id="themeBtn">🌙 <span>Dark</span></button>
  </div>
</header>

<div class="bar">
  <div class="inner">
    <nav class="nav" id="nav"></nav>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="text" id="search" placeholder="Search this hub" autocomplete="off">
    </div>
  </div>
</div>

<main class="page" id="sections"></main>
<div class="foot">Quilt Software · Sales Operations Hub — internal · <span id="count"></span></div>

<script>
const ICONS = {
  calculator:'<path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14v4M8 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  chart:'<path d="M4 20V6M10 20V10M16 20V4M22 20H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 2v6h6M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 19a2 2 0 0 0 2 2h13" stroke="currentColor" stroke-width="1.8"/>',
  tag:'<path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/>',
  flag:'<path d="M5 21V4m0 0 6 2 8-2v11l-8 2-6-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>'
};

const SECTIONS = [
  /* Tools is intentionally empty. The Payments Pricing Calculator was pulled
   * 2026-09-01 — it moved off Netlify and is being rebuilt — and the section is
   * kept so the tab and its place in the nav survive until there is something
   * to put back. */
  { title:'Tools', layout:'tiles', items:[
  ]},
  { title:'Dashboards', layout:'tiles', items:[
    { name:'Salesforce Projects Dashboard', desc:'Sprint progress, team capacity & project states.', url:'https://cx.quiltteam.com/sfdc-shortcut', icon:'chart', status:'live', published:'2026-04-15' },
  ]},
  { title:'Playbooks & Docs', layout:'list', items:[
    { name:'Pricing Guidelines', desc:'Rate cards, discount bands & approval thresholds.', url:'', icon:'tag' },
    { name:'Sales Process & Deal Stages', desc:'Stage definitions, exit criteria & handoffs.', url:'', icon:'flag' },
    { name:'Discounting & Approvals', desc:'Who can approve what, and how to request it.', url:'', icon:'doc' },
    { name:'Onboarding & Ramp', desc:'New-hire ramp plan and enablement resources.', url:'', icon:'book' },
  ]},
];

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const hostOf = url => { try{ return new URL(url).hostname.replace(/^www\./,''); }catch{ return ''; } };
const svg = n => '<svg viewBox="0 0 24 24" fill="none">'+(ICONS[n]||ICONS.doc)+'</svg>';
const chipFor = it => it.status==='live' ? '<span class="chip live">Live</span>' : (it.url ? '' : '<span class="chip soon">Link pending</span>');

function fmtDate(iso){ try{ return new Date(iso+'T00:00:00').toLocaleString('en-US',{month:'short',year:'numeric'}); }catch{ return ''; } }
function tileHTML(it,showDate){
  /* The status chip sits on its own meta line rather than beside the name.
   * Inline, it wrapped to a second line whenever a name was long, so tiles in
   * the same row came out different heights. The line doubles as somewhere to
   * show the destination host, which is worth having on a page of links. */
  const bits=[];
  if(it.url) bits.push(esc(hostOf(it.url)));
  if(showDate&&it.published) bits.push('Added '+fmtDate(it.published));
  /* "Live" was a chip on every working link, which is no signal at all and,
   * next to a long hostname, wrapped the line and made tiles uneven. Live is
   * now a dot; the chip is kept for the one state worth calling out. */
  const head = it.url
    ? '<span class="dot' + (it.status==='live' ? ' live' : '') + '"></span>'
    : chipFor(it);
  const meta = (bits.length||head)
    ? '<div class="tmeta">'+head+(bits.length?'<span class="host">'+bits.join(' · ')+'</span>':'')+'</div>'
    : '';
  const inner='<div class="ic">'+svg(it.icon)+'</div>'+
    '<div class="t"><div class="name">'+esc(it.name)+'</div>'+
    '<div class="desc">'+esc(it.desc)+'</div>'+meta+'</div>';
  return it.url ? '<a class="tile" href="'+esc(it.url)+'" target="_blank" rel="noopener"><span class="go">↗</span>'+inner+'</a>'
                : '<div class="tile pending">'+inner+'</div>';
}
function rowHTML(it){
  const meta = it.url ? esc(hostOf(it.url)) : chipFor(it);
  const inner='<div class="fi">'+svg(it.icon)+'</div>'+
    '<div class="nm"><div class="name">'+esc(it.name)+'</div><div class="desc">'+esc(it.desc)+'</div></div>'+
    '<div class="meta">'+meta+'</div>';
  return it.url ? '<a class="row" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+inner+'</a>'
                : '<div class="row pending">'+inner+'</div>';
}

let activeSection=null, query='';
function webpartHTML(title,layout,items,id,showDate){
  const body = layout==='list'
    ? '<div class="doclist">'+items.map(rowHTML).join('')+'</div>'
    : '<div class="tiles">'+items.map(it=>tileHTML(it,showDate)).join('')+'</div>';
  return '<section class="webpart" id="'+id+'"><div class="wp-head"><h2>'+esc(title)+'</h2>'+
         '<span class="n">'+items.length+' item'+(items.length!==1?'s':'')+'</span></div>'+body+'</section>';
}
function render(){
  const q=query.trim().toLowerCase();
  const match=it=> !q || (it.name+' '+it.desc).toLowerCase().includes(q);
  let html='', shown=0;
  if(activeSection===null){
    if(q){ // Home + search → matching results across every section
      SECTIONS.forEach(sec=>{ const items=sec.items.filter(match);
        if(items.length){ shown+=items.length; html+=webpartHTML(sec.title,sec.layout,items,slug(sec.title)); } });
    } else { // Home default → recently published, newest first
      const recent=SECTIONS.flatMap(s=>s.items.filter(i=>i.published))
                   .sort((a,b)=>String(b.published).localeCompare(String(a.published)));
      if(recent.length){ shown=recent.length; html+=webpartHTML('Recently published','tiles',recent,'home',true); }
    }
  } else { // a section tab → just that section
    const sec=SECTIONS.find(s=>s.title===activeSection);
    if(sec){ const items=sec.items.filter(match);
      if(items.length){ shown=items.length; html+=webpartHTML(sec.title,sec.layout,items,slug(sec.title)); } }
  }
  /* An empty section is not a failed search, and saying "No results" for one
   * reads like something broke. Three different situations, three messages. */
  let blank;
  if(q) blank='Nothing matches “'+esc(query.trim())+'”.';
  else if(activeSection) blank='Nothing in '+esc(activeSection)+' yet.';
  else blank='Nothing published yet.';
  document.getElementById('sections').innerHTML = shown ? html
    : '<div class="empty">'+blank+'</div>';
  document.getElementById('count').textContent = SECTIONS.reduce((n,s)=>n+s.items.length,0)+' resources';
}

// build top nav from sections (Home + one tab per section)
(function buildNav(){
  const nav=document.getElementById('nav');
  nav.innerHTML='<a class="active" tabindex="0">Home</a>'+
    SECTIONS.map(s=>'<a tabindex="0" data-title="'+esc(s.title)+'">'+esc(s.title)+'</a>').join('');
  const pick=a=>{
    [...nav.children].forEach(x=>x.classList.toggle('active',x===a));
    activeSection=a.dataset.title||null;
    window.scrollTo({top:0});
    render();
  };
  nav.addEventListener('click',e=>{ const a=e.target.closest('a'); if(a) pick(a); });
  nav.addEventListener('keydown',e=>{
    if(e.key!=='Enter'&&e.key!==' ')return;
    const a=e.target.closest('a'); if(!a)return;
    e.preventDefault(); pick(a);
  });
})();

document.getElementById('search').addEventListener('input',e=>{ query=e.target.value; render(); });
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dark?'light':'dark');
  document.getElementById('themeBtn').innerHTML = dark?'🌙 <span>Dark</span>':'☀️ <span>Light</span>';
});
render();
</script>
</body>
</html>
