<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>Sales Operations Hub</title>
<style>
:root{
  --bg:#f5f6f8; --surface:#ffffff; --surface-2:#fafbfc;
  --ink:#101828; --ink-2:#344054; --muted:#667085;
  --line:#e5e7eb; --line-2:#f0f1f3;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-light:#dbeafe;
  --badge:#eef2ff; --badge-ink:#3730a3;
  --band:#1e3a8a; --band-ink:#ffffff; --band-sub:#bfdbfe;
  --foot:#111827; --foot-ink:#f3f4f6; --foot-muted:#9ca3af;
  --good:#059669; --good-wash:#ecfdf3;
  --shadow-card:0 1px 3px rgba(0,0,0,.1);
  --shadow-lift:0 4px 12px rgba(0,0,0,.15);
  --r-card:12px; --r-hero:18px;
}
html[data-theme="dark"]{
  --bg:#0f1419; --surface:#1a1f2e; --surface-2:#232a3b;
  --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9ca3af;
  --line:#374151; --line-2:#4b5563;
  --accent:#60a5fa; --accent-dark:#93c5fd; --accent-light:#1e40af;
  --badge:#312e81; --badge-ink:#a5b4fc;
  --band:#1e3a8a; --band-ink:#f0f9ff; --band-sub:#93c5fd;
  --foot:#030712; --foot-ink:#e5e7eb; --foot-muted:#6b7280;
  --good:#10b981; --good-wash:#051f1f;
  --shadow-card:0 1px 3px rgba(0,0,0,.3);
  --shadow-lift:0 4px 12px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,
       "Inter",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.wrap{max-width:1200px;margin:0 auto;padding:0 32px}

/* top bar */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{height:64px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:16px;letter-spacing:-.3px}
.brand .mark{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent);flex:0 0 auto}
.brand .mark svg{width:18px;height:18px;color:#fff}
.brand em{font-style:normal;color:var(--accent)}
.topnav{display:flex;gap:24px;margin-left:auto;margin-right:20px}
.topnav a{font-size:14px;font-weight:550;color:var(--ink-2);cursor:pointer}
.topnav a:hover{color:var(--accent)}
.theme{border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;
  font-weight:550;display:flex;gap:6px;align-items:center}
.theme:hover{background:var(--surface-2);color:var(--ink)}

/* hero */
.hero-shell{padding:48px 0 0}
.hero{background:var(--surface);border-radius:var(--r-hero);padding:56px 40px;text-align:center}
.hero h1{margin:0;font-size:42px;font-weight:800;letter-spacing:-1.5px;line-height:1.15}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:16px auto 0;max-width:580px;color:var(--muted);font-size:16px;line-height:1.7}
.searchrow{margin:32px auto 0;max-width:560px;position:relative}
.searchrow input{
  width:100%;padding:14px 56px 14px 44px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:15px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-card);transition:border-color .2s,box-shadow .2s
}
.searchrow input::placeholder{color:var(--muted)}
.searchrow input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-light)}
.searchrow .mag{position:absolute;left:15px;top:50%;transform:translateY(-50%);
  width:18px;height:18px;color:var(--muted);pointer-events:none}
.searchrow .clear{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  width:36px;height:36px;border-radius:8px;border:0;cursor:pointer;
  background:var(--accent);color:#fff;display:grid;place-items:center;
  transition:background .2s
}
.searchrow .clear:hover{background:var(--accent-dark)}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0 0}
.chips button{
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  border-radius:8px;padding:8px 16px;font:inherit;font-size:13.5px;font-weight:550;
  cursor:pointer;transition:all .2s
}
.chips button:hover{border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* sections */
main{padding:52px 0 12px}
.sec{margin:0 0 48px;scroll-margin-top:80px}
.sec-head{text-align:center;margin:0 0 32px}
.sec-head h2{margin:0;font-size:26px;font-weight:750;letter-spacing:-.6px}
.sec-head p{margin:10px 0 0;color:var(--muted);font-size:14px}

/* cards grid */
.cards{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{
  display:flex;flex-direction:column;gap:16px;min-width:0;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:24px;box-shadow:var(--shadow-card);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease
}
a.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--accent-light)}
.card.pending{background:var(--surface-2);box-shadow:none;opacity:.65}
.card .row{display:flex;gap:16px;align-items:flex-start;min-width:0}
.card .badge{
  flex:0 0 48px;width:48px;height:48px;border-radius:var(--r-card);display:grid;place-items:center;
  background:var(--accent-light);color:var(--accent);font-weight:700;font-size:20px
}
.card.pending .badge{background:var(--badge);color:var(--badge-ink)}
.card .badge svg{width:24px;height:24px}
.card .txt{min-width:0;flex:1}
.card .name{font-size:15px;font-weight:680;letter-spacing:-.3px;line-height:1.4}
.card .desc{margin-top:6px;font-size:13.5px;color:var(--muted);line-height:1.6}
.card .meta{margin-top:12px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.card .meta .dot{width:5px;height:5px;border-radius:50%;background:var(--good)}
.card .act{
  display:inline-flex;align-items:center;gap:8px;margin-top:4px;
  color:var(--accent);font-size:13px;font-weight:620;white-space:nowrap;
  transition:gap .2s
}
a.card:hover .act{gap:12px}
.card .act.off{color:var(--muted);opacity:.6}
.card .arrow{width:16px;height:16px;transition:transform .2s}
a.card:hover .arrow{transform:translateX(3px)}

.empty{color:var(--muted);font-size:15px;padding:56px 32px;text-align:center;
  background:var(--surface);border:1px dashed var(--line);border-radius:var(--r-card)}

.none{color:var(--muted);font-size:13px;text-align:center;padding:24px}

/* cta band */
.band{
  background:linear-gradient(135deg,var(--band) 0%,#1e40af 100%);color:var(--band-ink);
  border-radius:var(--r-hero);padding:56px 40px;text-align:center;margin:16px 0 0;
}
.band h2{margin:0;font-size:32px;font-weight:800;letter-spacing:-1px}
.band p{margin:14px auto 0;max-width:600px;color:var(--band-sub);font-size:15px;line-height:1.7}
.band .btn{
  display:inline-flex;align-items:center;gap:10px;margin:24px 0 0;
  background:#fff;color:var(--band);border-radius:8px;padding:13px 28px;
  font-size:14px;font-weight:650;transition:all .2s
}
.band .btn:hover{transform:translateY(-2px);box-shadow:0 8px 16px rgba(0,0,0,.2)}
.band .btn.off{background:rgba(255,255,255,.2);color:var(--band-sub);cursor:default}
.band .btn.off:hover{transform:none}

/* footer */
.foot{background:var(--foot);color:var(--foot-ink);margin-top:64px;padding:52px 0 0}
.foot .cols{display:grid;grid-template-columns:1.5fr repeat(auto-fit,minmax(150px,1fr));
  gap:40px;padding-bottom:40px}
.foot .about p{margin:0;color:var(--foot-muted);font-size:13px;line-height:1.7;max-width:280px}
.foot h3{margin:0 0 16px;font-size:11px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--foot-muted)}
.foot ul{margin:0;padding:0;list-style:none}
.foot li{margin-bottom:10px;font-size:13.5px}
.foot li a:hover{color:#fff}
.foot li span{color:var(--foot-muted)}
.foot .rule{border-top:1px solid rgba(255,255,255,.1);padding:20px 0 28px;
  display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;
  color:var(--foot-muted);font-size:12px}

@media (max-width:768px){
  .topnav{display:none}
  .hero{padding:40px 24px}
  .hero h1{font-size:32px}
  .hero p{font-size:15px}
  .wrap{padding:0 20px}
  main{padding:36px 0 8px}
  .cards{grid-template-columns:1fr}
  .band{padding:40px 24px}
  .band h2{font-size:24px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="top">
  <div class="wrap">
    <a class="brand" href="#top">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none"><path d="M4 8h16M4 12h16M4 16h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="8" cy="8" r="1.7" fill="currentColor"/><circle cx="15" cy="16" r="1.7" fill="currentColor"/></svg></span>
      Sales<em>Ops</em> Hub
    </a>
    <nav class="topnav" id="topnav"></nav>
    <button class="theme" id="themeBtn">🌙 Dark</button>
  </div>
</div>

<div class="hero-shell" id="top">
  <div class="wrap">
    <div class="hero">
      <h1>How can Sales <em>Ops</em> help?</h1>
      <p>Find the tools, dashboards, and resources your team needs to close deals faster.</p>
      <div class="searchrow">
        <svg class="mag" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input type="text" id="search" placeholder="Search tools, dashboards, resources..." autocomplete="off" aria-label="Search this hub">
        <button class="clear" id="clearBtn" aria-label="Search"></button>
      </div>
      <div class="chips" id="chips"></div>
    </div>
  </div>
</div>

<main class="wrap" id="sections"></main>

<div class="wrap">
  <section class="band" id="band"></section>
</div>

<footer class="foot">
  <div class="wrap">
    <div class="cols" id="footCols"></div>
    <div class="rule">
      <span>© <span id="yr"></span> Quilt Software · internal use only</span>
      <span id="count"></span>
    </div>
  </div>
</footer>

<script>
const ICONS = {
  calculator:'<path d="M6 2h12a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.8"/><path d="M8 6h8M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14v4M8 18h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  chart:'<path d="M4 20V6M10 20V10M16 20V4M22 20H2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 2v6h6M8 13h8M8 17h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  book:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 19a2 2 0 0 0 2 2h13" stroke="currentColor" stroke-width="1.8"/>',
  tag:'<path d="M3 12V5a2 2 0 0 1 2-2h7l9 9-9 9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/>',
  flag:'<path d="M5 21V4m0 0 6 2 8-2v11l-8 2-6-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>',
  people:'<circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.8"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M17 11a3 3 0 1 0 0-6M18 20c0-2.2-.8-4-2-5.3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
  spark:'<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M18 16.5l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>'
};

const SECTIONS = [
  { title:'Dashboards', blurb:'Live reporting on pipeline, projects and team capacity.', items:[
    { name:'Salesforce Projects Dashboard', desc:'Sprint progress, team capacity & project states.', url:'https://cx.quiltteam.com/sfdc-shortcut', icon:'chart', published:'2026-04-15' },
  ]},
];

const CTA = {
  heading:'Need something more specific?',
  body:'If a tool or resource you need isn't here, Sales Operations can build it or point you in the right direction.',
  label:'Ask Sales Ops',
  url:'',
};

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
const hostOf = u => { try{ return new URL(u).hostname.replace(/^www\./,''); }catch{ return ''; } };
const svg = n => '<svg viewBox="0 0 24 24" fill="none">'+(ICONS[n]||ICONS.doc)+'</svg>';
const ARROW = '<svg class="arrow" viewBox="0 0 24 24" fill="none" width="16" height="16"><path d="M5 12h13M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

let query='', activeChip=null;

function cardHTML(it){
  const host = hostOf(it.url);
  const body='<div class="row"><div class="badge">'+svg(it.icon)+'</div>'+
    '<div class="txt"><div class="name">'+esc(it.name)+'</div>'+
    '<div class="desc">'+esc(it.desc)+'</div>'+
    (it.url ? '<div class="act">Open'+ARROW+'</div>' : '<div class="act off">Link pending</div>')+
    '</div></div>';

  if(!it.url){
    return '<div class="card pending">'+body+'</div>';
  }
  return '<a class="card" href="'+esc(it.url)+'" target="_blank" rel="noopener">'+body+
    (host ? '<div class="meta"><span class="dot"></span><span>'+esc(host)+'</span></div>' : '')+
    '</a>';
}

function sectionHTML(sec, items){
  return '<section class="sec" id="'+slug(sec.title)+'">'+
    '<div class="sec-head"><h2>'+esc(sec.title)+'</h2>'+
    (sec.blurb?'<p>'+esc(sec.blurb)+'</p>':'')+'</div>'+
    (items.length
      ? '<div class="cards">'+items.map(cardHTML).join('')+'</div>'
      : '<div class="none">Nothing here yet.</div>')+
    '</section>';
}

function render(){
  const q=query.trim().toLowerCase();
  const match=it=> !q || (it.name+' '+it.desc).toLowerCase().includes(q);
  let html='', shown=0;
  SECTIONS.forEach(sec=>{
    if(activeChip && sec.title!==activeChip) return;
    const items=sec.items.filter(match);
    shown+=items.length;
    if(q && !items.length) return;
    html+=sectionHTML(sec,items);
  });
  document.getElementById('sections').innerHTML = html ||
    '<div class="empty">Nothing matches "'+esc(query.trim())+'".</div>';
  const total=SECTIONS.reduce((n,s)=>n+s.items.length,0);
  const live=SECTIONS.reduce((n,s)=>n+s.items.filter(i=>i.url).length,0);
  document.getElementById('count').textContent = live+' of '+total+' resources live';
}

(function build(){
  document.getElementById('yr').textContent=new Date().getFullYear();

  document.getElementById('topnav').innerHTML =
    SECTIONS.map(s=>'<a href="#'+slug(s.title)+'">'+esc(s.title)+'</a>').join('');

  const chips=document.getElementById('chips');
  chips.innerHTML='<button data-chip="">All</button>'+
    SECTIONS.map(s=>'<button data-chip="'+esc(s.title)+'">'+esc(s.title)+'</button>').join('');
  const mark=()=>[...chips.children].forEach(b=>
    b.classList.toggle('on',(b.dataset.chip||null)===activeChip));
  chips.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    activeChip=b.dataset.chip||null; mark(); render();
  });
  mark();

  const band=CTA.url
    ? '<a class="btn" href="'+esc(CTA.url)+'" target="_blank" rel="noopener">'+esc(CTA.label)+ARROW+'</a>'
    : '<span class="btn off">'+esc(CTA.label)+'</span>';
  document.getElementById('band').innerHTML =
    '<h2>'+esc(CTA.heading)+'</h2><p>'+esc(CTA.body)+'</p>'+band;

  document.getElementById('footCols').innerHTML =
    '<div class="about"><div class="brand">Sales<em>Ops</em> Hub</div>'+
    '<p>Maintained by Quilt Software Sales Operations. Internal use only.</p></div>'+
    SECTIONS.map(s=>'<div><h3>'+esc(s.title)+'</h3><ul>'+
      (s.items.length
        ? s.items.map(i=>'<li>'+(i.url
            ? '<a href="'+esc(i.url)+'" target="_blank" rel="noopener">'+esc(i.name)+'</a>'
            : '<span>'+esc(i.name)+'</span>')+'</li>').join('')
        : '<li><span>Coming soon</span></li>')+
      '</ul></div>').join('');

  const input=document.getElementById('search');
  const btn=document.getElementById('clearBtn');
  const MAG='<svg viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>';
  const EX='<svg viewBox="0 0 24 24" fill="none"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
  const syncBtn=()=>{
    const has=input.value.trim()!=='';
    btn.innerHTML=has?EX:MAG;
  };
  input.addEventListener('input',e=>{ query=e.target.value; syncBtn(); render(); });
  btn.addEventListener('click',()=>{
    if(input.value.trim()==='') { input.focus(); return; }
    input.value=''; query=''; syncBtn(); input.focus(); render();
  });
  syncBtn();
  document.getElementById('themeBtn').addEventListener('click',()=>{
    const dark=document.documentElement.getAttribute('data-theme')==='dark';
    document.documentElement.setAttribute('data-theme',dark?'light':'dark');
    document.getElementById('themeBtn').innerHTML=dark?'🌙 Dark':'☀️ Light';
  });
  render();
})();
</script>
</body>
</html>
