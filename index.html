<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="light dark"/>
<title>Sales Operations Support Center</title>
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#fafbfc;
  --ink:#101828; --ink-2:#344054; --muted:#667085;
  --line:#e5e7eb; --line-2:#f0f1f3;
  --accent:#2563eb; --accent-dark:#1d4ed8; --accent-light:#dbeafe;
  --badge:#eef2ff; --badge-ink:#3730a3;
  --band:#1e3a8a; --band-ink:#ffffff; --band-sub:#bfdbfe;
  --foot:#111827; --foot-ink:#f3f4f6; --foot-muted:#9ca3af;
  --good:#059669; --good-wash:#ecfdf3;
  --shadow-card:0 1px 3px rgba(0,0,0,.1);
  --shadow-lift:0 4px 12px rgba(0,0,0,.15);
  --r-card:12px;
}
html[data-theme="dark"]{
  --bg:#0f1419; --surface:#1a1f2e; --surface-2:#232a3b;
  --ink:#f3f4f6; --ink-2:#d1d5db; --muted:#9ca3af;
  --line:#374151; --line-2:#4b5563;
  --accent:#60a5fa; --accent-dark:#93c5fd; --accent-light:#1e40af;
  --badge:#312e81; --badge-ink:#a5b4fc;
  --band:#1e3a8a; --band-ink:#f0f9ff; --band-sub:#93c5fd;
  --foot:#030712; --foot-ink:#e5e7eb; --foot-muted:#6b7280;
  --good:#10b981; --good-wash:#051f1f;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 "Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,
       "Inter",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;min-height:100vh
}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* header */
.header{
  background:var(--surface);border-bottom:1px solid var(--line);
  height:56px;display:flex;align-items:center;gap:16px;padding:0 16px;
}
.toggle-sidebar{
  border:0;background:none;color:var(--ink);font-size:20px;cursor:pointer;
  width:40px;height:40px;display:grid;place-items:center;border-radius:8px;
  transition:background .2s
}
.toggle-sidebar:hover{background:var(--surface-2)}
.header-spacer{flex:1}
.theme-btn{
  border:1px solid var(--line);background:var(--surface);color:var(--ink-2);
  border-radius:8px;padding:8px 14px;cursor:pointer;font:inherit;font-size:13px;
  font-weight:550;display:flex;gap:6px;align-items:center;transition:all .2s
}
.theme-btn:hover{background:var(--surface-2)}

/* sidebar */
.sidebar{
  width:240px;background:var(--surface);border-right:1px solid var(--line);
  padding:24px 0;overflow-y:auto;flex-shrink:0;
  transition:transform .3s ease,width .3s ease
}
.sidebar.collapsed{transform:translateX(-100%);width:0}
.sidebar-section{padding:0 16px;margin-bottom:24px}
.sidebar-title{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin:0 0 10px;padding:0
}
.sidebar-items{
  list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px
}
.sidebar-items a{
  display:block;padding:8px 12px;border-radius:6px;font-size:14px;
  color:var(--ink-2);transition:all .2s
}
.sidebar-items a:hover{background:var(--surface-2);color:var(--accent)}

/* main layout */
.container{display:flex;flex:1;min-height:0}
.main-content{flex:1;overflow-y:auto;padding:0}

/* hero */
.hero{
  background:var(--surface);border-bottom:1px solid var(--line);
  padding:32px 40px;
}
.hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:-.6px}
.hero p{margin:8px 0 0;color:var(--muted);font-size:14px}
.hero-search{margin:18px 0 0;position:relative;max-width:500px}
.hero-search input{
  width:100%;padding:11px 38px 11px 36px;border:1px solid var(--line);border-radius:8px;
  font:inherit;font-size:14px;background:var(--surface);color:var(--ink);
  box-shadow:var(--shadow-card);transition:border-color .2s,box-shadow .2s
}
.hero-search input::placeholder{color:var(--muted)}
.hero-search input:focus{outline:0;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)}
.hero-search .mag{position:absolute;left:12px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--muted);pointer-events:none}

/* content wrapper */
.content-wrapper{padding:32px 40px;display:grid;grid-template-columns:1fr;gap:32px}

/* channels */
.channels h2{margin:0 0 20px;font-size:18px;font-weight:750;letter-spacing:-.4px}
.channels-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:40px
}
.channel{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-card);
  padding:24px;box-shadow:var(--shadow-card);cursor:pointer;transition:all .2s;
  text-decoration:none;display:flex;flex-direction:column
}
.channel:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift);border-color:var(--accent-light)}
.channel-icon{
  font-size:11px;font-weight:700;margin-bottom:12px;width:48px;height:48px;display:grid;place-items:center;
  background:var(--accent-light);color:var(--accent);border-radius:8px;letter-spacing:0.5px;text-transform:uppercase
}
.channel h3{margin:0 0 8px;font-size:15px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.channel p{margin:0;font-size:13px;color:var(--muted);line-height:1.5;flex:1}
.channel-action{
  margin-top:12px;font-size:13px;font-weight:600;color:var(--accent);
  display:flex;align-items:center;gap:6px
}
.channel-action::after{content:'→';font-weight:400}


/* footer */
.footer{
  background:var(--foot);color:var(--foot-ink);border-top:1px solid rgba(255,255,255,.1);
  padding:24px 40px;margin-top:auto;font-size:12px;color:var(--foot-muted)
}

@media (max-width:1024px){
  .sidebar{position:fixed;left:0;top:56px;height:calc(100vh - 56px);z-index:100;
    box-shadow:2px 0 8px rgba(0,0,0,.1)}
  .content-wrapper{grid-template-columns:1fr}
  .channels-grid{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:768px){
  .header{padding:0 12px}
  .toggle-sidebar{width:36px;height:36px}
  .hero{padding:20px 16px}
  .hero h1{font-size:20px}
  .content-wrapper{padding:20px 16px;gap:20px}
  .channels-grid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  *{transition:none !important}
}
</style>
</head>
<body>

<div class="header">
  <button class="toggle-sidebar" id="toggleSidebar" aria-label="Toggle sidebar">☰</button>
  <div class="header-spacer"></div>
  <button class="theme-btn" id="themeBtn">☀️ Light</button>
</div>

<div class="container">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-section">
      <h3 class="sidebar-title">Dashboards</h3>
      <ul class="sidebar-items">
        <li><a href="https://cx.quiltteam.com/sfdc-shortcut" target="_blank" rel="noopener">Salesforce Projects</a></li>
      </ul>
    </div>
  </aside>

  <main class="main-content">
    <div class="hero">
      <h1>Support Center</h1>
      <p>Get help and find answers to your questions</p>
      <div class="hero-search">
        <svg class="mag" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2.2"/><path d="m20 20-3-3" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
        <input type="text" id="search" placeholder="Search channels and FAQs..." autocomplete="off" aria-label="Search support center">
      </div>
    </div>

    <div class="content-wrapper">
      <div>
        <section class="channels">
          <h2>How can we help?</h2>
          <div class="channels-grid" id="channelsGrid"></div>

        </section>
      </div>

    </div>
  </main>
</div>

<footer class="footer">
  <div>© <span id="yr"></span> Quilt Software · Internal use only</div>
</footer>

<script>
const CHANNELS = [
  { title:'Pricing & Discounting', desc:'Rate cards, discount structures, and pricing strategies.', icon:'PD', url:'https://pricing-hub-production-2481.up.railway.app/' },
  { title:'Sales Documents', desc:'Bookings rules, playbooks, guides, and sales enablement materials.', icon:'SD', url:'https://sales-documents-hub-production.up.railway.app/' },
  { title:'Internal Team Tools', desc:'Internal tools and resources.', icon:'IT', url:'https://internal-team-tools-production.up.railway.app/' },
  { title:'Reporting & Analytics', desc:'Dashboards, reports, and data access.', icon:'RA', url:'https://sales-reporting-hub.up.railway.app/' },
  { title:'Systems & Access', desc:'Salesforce, tool onboarding, and user management.', icon:'SA', url:'https://systems-access-hub-production.up.railway.app/' },
  { title:'Ask Sales Ops', desc:'General questions or special requests.', icon:'ASO' },
];

let query = '';

function renderChannels(){
  const filtered = query.toLowerCase() === '' ? CHANNELS :
    CHANNELS.filter(c => (c.title + ' ' + c.desc).toLowerCase().includes(query.toLowerCase()));

  document.getElementById('channelsGrid').innerHTML = filtered.map(c => `
    <${c.url ? 'a href="' + c.url + '"' : 'div'} class="channel">
      <div class="channel-icon">${c.icon}</div>
      <h3>${c.title}</h3>
      <p>${c.desc}</p>
      <div class="channel-action">Get help</div>
    </${c.url ? 'a' : 'div'}>
  `).join('');
}


document.getElementById('toggleSidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

document.getElementById('search').addEventListener('input', e => {
  query = e.target.value;
  renderChannels();
});


document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.documentElement.setAttribute('data-theme', dark ? 'light' : 'dark');
  document.getElementById('themeBtn').innerHTML = dark ? '🌙 Dark' : '☀️ Light';
});

document.getElementById('yr').textContent = new Date().getFullYear();

renderChannels();
</script>
</body>
</html>
